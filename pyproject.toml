[project]
name = "DAgger-vs-symmetric-sampling-in-Super-Tux-Kart"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "gymnasium",
    "matplotlib",
    "numpy",
    "omegaconf",
    "pystk2-gymnasium>=0.10.0",
    "scipy",
    "torch",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = true

[tool.hatch.build.targets.wheel]
packages = ["src"]
