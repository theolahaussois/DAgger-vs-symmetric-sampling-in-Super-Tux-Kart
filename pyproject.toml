[project]
name = "DAgger-vs-symmetric-sampling-in-Super-Tux-Kart"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "gymnasium",
    "ipywidgets",
    "jupyter",
    "jupyterlab",
    "matplotlib",
    "mazemdp",
    "numpy",
    "omegaconf",
    "optuna",
    "pandas>=3.1.1",
    "plotly>=7.1.0",
    "pystk2-gymnasium>=0.10.0",
    "pysupertuxkart2>=0.7.4",
    "pyyaml",
    "rl-mind",
    "scipy",
    "torch",
    "tqdm",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = true

[tool.hatch.build.targets.wheel]
packages = ["src"]
